# Modelo revisado do exemplo de vendas (dados fictícios em fixtures/vendas.csv).
versao: "0.1"
fonte:
  tabela: vendas
  coluna_data: data_pedido
dimensoes:
  regiao: {coluna: regiao, descricao: Região}
  uf: {coluna: uf, descricao: UF}
  loja: {coluna: loja, descricao: Loja}
  canal: {coluna: canal, descricao: Canal de venda}
  categoria: {coluna: categoria, descricao: Categoria}
  mes: {coluna: data_pedido, granularidade: mes, descricao: Mês}
  dia_da_semana: {coluna: data_pedido, granularidade: dia_semana, descricao: Dia da semana}
metricas:
  receita_total: {descricao: Faturamento, tipo: soma, coluna: receita, formato: moeda}
  pedidos: {descricao: Pedidos, tipo: contagem_distinta, coluna: pedido_id, formato: inteiro}
  ticket_medio: {descricao: Ticket médio, tipo: razao, numerador: receita_total, denominador: pedidos, formato: moeda}
  desconto_medio: {descricao: Desconto médio, tipo: media, coluna: desconto_pct, formato: numero, unidade: "%"}
  participacao_receita: {descricao: Participação no faturamento, tipo: participacao, metrica: receita_total, formato: percentual}
  receita_por_dia: {descricao: Faturamento por dia, tipo: por_dia, metrica: receita_total, formato: moeda}
