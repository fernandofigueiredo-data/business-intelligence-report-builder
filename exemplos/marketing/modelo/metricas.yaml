  taxa_de_clique: {descricao: Taxa de clique, tipo: razao, numerador: cliques, denominador: impressoes, formato: percentual}
  custo_por_conversao: {descricao: Custo por conversão, tipo: razao, numerador: investimento, denominador: conversoes, formato: moeda, melhor: menor}
