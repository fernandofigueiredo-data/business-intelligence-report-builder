# Modelo revisado do exemplo de marketing (dados fictícios em fixtures/marketing.xlsx).
versao: "0.1"
fonte:
  tabela: marketing
  coluna_data: data
dimensoes:
  canal: {coluna: canal, descricao: Canal}
  campanha: {coluna: campanha, descricao: Campanha}
  semana: {coluna: data, granularidade: semana, descricao: Semana}
metricas:
